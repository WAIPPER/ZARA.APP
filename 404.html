<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Zara</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%236c63ff'/><stop offset='100%25' style='stop-color:%23ff6584'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text y='.9em' font-size='72' x='12'>💬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0f14;--accent:#6c63ff;--accent2:#ff6584;--text:#e8eaf0;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:380px}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .icon{font-size:72px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  h1{font-family:'Syne',sans-serif;font-weight:800;font-size:72px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
  p{color:var(--muted);font-size:15px;line-height:1.6}
  a{display:inline-block;margin-top:8px;background:linear-gradient(135deg,var(--accent),#a78bfa);color:#fff;text-decoration:none;padding:14px 32px;border-radius:14px;font-weight:700;font-size:15px;transition:all .25s;box-shadow:0 4px 20px rgba(108,99,255,.4)}
  a:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(108,99,255,.5)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Zara</div>
    <div class="icon">🔍</div>
    <h1>404</h1>
    <p>Oops ! Cette page n'existe pas.<br>Tu t'es peut-être perdu en chemin 😅</p>
    <a href="/">← Retour à Zara</a>
  </div>
</body>
</html>
